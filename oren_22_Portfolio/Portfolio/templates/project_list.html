{% extends 'master/base.html' %}

{% block content %}

<style>
    body{
    background:#f5f7fa;
    font-family:Arial, Helvetica, sans-serif;
}

.page-title{
    text-align:center;
    margin:40px 0;
    color:#333;
}

.card-container{
    width:90%;
    margin:auto;

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:25px;
    margin-top: 20px;
}

.card{
    background:#fff;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,.1);
    transition:.3s;
}

.card:hover{
    transform:translateY(-8px);
    box-shadow:0 15px 30px rgba(0,0,0,.15);
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.card-content{
    padding:20px;
}

.card-content h3{
    margin-bottom:12px;
    color:#222;
}

.card-content p{
    color:#666;
    line-height:1.6;
    margin-bottom:20px;
}

.btn{
    display: inline-block;
    color: #fff;
    text-decoration: none;
    padding: 10px 20px;
    border-radius: 6px;
    transition: 0.3s;
    border: none;
    cursor: pointer;
}

/* View Button (Blue) */
.btn-view{
    background: #0d6efd;
}

.btn-view:hover{
    background: #0b5ed7;
}

/* Edit Button (Yellow) */
.btn-edit{
    background: #ffc107;
    color: #000;
}

.btn-edit:hover{
    background: #e0a800;
}

/* Delete Button (Red) */
.btn-delete{
    background: #dc3545;
}

.btn-delete:hover{
    background: #bb2d3b;
}
.btn:hover{
    background:#084298;
}
</style>

<h1 class="page-title">Projects List</h1>
<a href="{% url 'add_project' %}" class="btn">Add Project</a>

<div class="card-container">

    {% for data in project_data %}
    <div class="card">
        <img src="{{ data.image.url }}" alt="{{ data.title }}">

        <div class="card-content">
            <h3>{{ data.title }}</h3>

            <p>
                {{ data.description|truncatewords:20 }}
            </p>

            <a href="#" class="btn">View</a>
            <a href="{% url 'edit_project' data.id %}" class="btn btn-edit">Update</a>
            <a href="{% url 'delete_project' data.id %}" class="btn btn-delete">Delete</a>
        </div>
    </div>
    {% endfor %}

</div>

{% endblock %}
