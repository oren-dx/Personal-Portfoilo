{% extends 'master/base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<h1>{{title}}</h1>
<form action="" method="POST" enctype="multipart/form-data"> 
    {% csrf_token %}
    {{form_data | crispy}}

    <button type="submit" class="btn btn-primary">{{btn_name}}</button>
</form>
    
{% endblock content %}
